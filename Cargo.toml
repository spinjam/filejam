[package]
name = "filejam"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A fast, native, dual-pane SFTP client"
publish = false

# Exact pins on the GPUI stack, the same versions dbdelve runs: gpui is
# pre-1.0 and breaks on minor bumps. Commit Cargo.lock with any change.
[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = { version = "=0.8.0" }
gpui_platform = { version = "=0.3.9", package = "gpui-pre-platform", features = [
    "font-kit",
    "x11",
    "wayland",
] }
guic-gpui-assets = "=0.2.0"
icondata_lu = "=0.1.0"
icondata_core = "=0.1.0"

# SSH and SFTP, pure Rust. `ring` rather than the default aws-lc-rs: ring is
# already in the tree through rustls and needs no C toolchain or cmake.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"

tokio = { version = "=1.53.1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "macros",
    "fs",
    "io-util",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
keyring = "4"
time = { version = "=0.3.55", default-features = false, features = [
    "formatting",
    "macros",
    "local-offset",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[patch.crates-io]
# Vendored from dbdelve: gpui with a backdrop blur and alpha that composites
# with `over`, and gpui-component whose popups use that blur. Every change is
# marked `dbdelve patch`; re-apply them on a gpui bump.
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-component = { path = "vendor/gpui-component" }

# GPUI lays out and shapes text on the CPU every frame; unoptimized it drops
# frames the moment a long listing scrolls.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
